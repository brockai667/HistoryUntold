name: PriceTrap Daily

on:
  schedule:
    - cron: "10 6 * * *"   # 06:10 UTC, jedno video denne
  workflow_dispatch:
    inputs:
      case:
        description: "ID prípadu z bank/cases.json (prázdne = prvý nepoužitý)"
        type: string
        required: false
        default: ""
      no_post:
        description: "true = len vyrobiť video (bez GitHub Release a bez zápisu stavu)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: pricetrap
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: System deps (ffmpeg, Chrome libs)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libnss3 libatk-bridge2.0-0 libgbm1 libasound2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2
      - name: Python deps
        run: pip install edge-tts numpy soundfile requests
      - name: Node deps
        run: npm ci --no-audit --no-fund
        working-directory: remotion
      - name: Chrome pre Remotion
        run: npx remotion browser ensure
        working-directory: remotion

      - name: Epizóda (autor -> prep -> render -> GitHub Release)
        env:
          MODELS_TOKEN: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CASE_ID: ${{ github.event.inputs.case }}
          NO_POST: ${{ github.event.inputs.no_post }}
        run: |
          args=()
          if [ -n "$CASE_ID" ]; then args+=(--case "$CASE_ID"); fi
          if [ "$NO_POST" = "true" ]; then args+=(--no-post); fi
          python -u tools/run.py "${args[@]}"

      - name: Video ako artefakt (kontrola, 7 dní)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricetrap-${{ github.run_number }}
          path: output/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Persist state
        if: always()
        run: |
          git config user.name "pricetrap-bot"
          git config user.email "pricetrap-bot@users.noreply.github.com"
          git add state.json episodes
          git diff --cached --quiet || git commit -m "pricetrap: ep $(date -u +%F)"
          git pull --rebase || true
          git push || true
